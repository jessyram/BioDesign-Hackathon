<!DOCTYPE html>
<html>
<head>
  <title>Profile Setup - GripScribe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Profile Setup</h1>

  <!-- PERSONAL INFO -->
  <div class="card">
    <h3>Personal Information</h3>

    <input type="text" id="name" placeholder="Full Name">
    <input type="number" id="age" placeholder="Age">

    <select id="gender">
      <option value="">Gender</option>
      <option>Female</option>
      <option>Male</option>
      <option>Other</option>
    </select>

    <select id="hand">
      <option value="">Dominant Hand</option>
      <option>Right</option>
      <option>Left</option>
    </select>

    <select id="condition">
      <option value="">Condition</option>
      <option>None</option>
      <option>Carpal Tunnel</option>
      <option>Osteoarthritis</option>
      <option>Injury Recovery</option>
    </select>
  </div>

  <!-- HEALTHCARE PROVIDER -->
  <div class="card">
    <h3>Healthcare Provider (Optional)</h3>

    <input type="text" id="providerName" placeholder="Provider Name">
    <input type="text" id="clinic" placeholder="Clinic / Hospital">
    <input type="email" id="providerEmail" placeholder="Provider Email">

    <textarea id="notes" placeholder="Notes for provider (optional)" rows="3"></textarea>
  </div>

  <!-- BASELINE TEST -->
  <div class="card">
    <h3>Baseline Grip Test</h3>

    <p>
      Grip the pen as firmly as possible for <strong>3–5 seconds</strong>.
      This measurement will be used as your baseline.
    </p>

    <input type="number" id="baseline" placeholder="Enter baseline value">
  </div>

  <button onclick="saveProfile()">Continue</button>

</div>

<script>
function saveProfile() {
  const profile = {
    name: document.getElementById("name").value,
    age: document.getElementById("age").value,
    gender: document.getElementById("gender").value,
    hand: document.getElementById("hand").value,
    condition: document.getElementById("condition").value,
    baseline: document.getElementById("baseline").value,

    provider: {
      name: document.getElementById("providerName").value,
      clinic: document.getElementById("clinic").value,
      email: document.getElementById("providerEmail").value,
      notes: document.getElementById("notes").value
    }
  };

  localStorage.setItem("profile", JSON.stringify(profile));

  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
